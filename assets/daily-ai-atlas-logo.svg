<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Daily AI Atlas logo</title>
  <desc id="desc">A futuristic atlas logo with neural nodes, orbital paths, and an AI navigation mark.</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="28" x2="230" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.52" stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#20242A"/>
    </linearGradient>
