<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Daily Atlas</title>
    <link rel="icon" href="./assets/daily-ai-atlas-logo.svg?v=20260515-tech-minimal" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20260515-light-language-switch-2" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="date-rail" aria-label="日报日期归档">
        <div class="brand">
          <img class="brand-logo" src="./assets/daily-ai-atlas-logo.svg?v=20260515-tech-minimal" alt="AI Daily Atlas logo" />
          <div>
            <h1>AI Daily Atlas</h1>
            <p class="brand-subtitle">Catch AI signals as they emerge</p>
          </div>
        </div>

        <section class="term-spotlight" id="termSpotlight" aria-label="今日 AI 词条"></section>

        <div class="rail-section">
          <label for="dateSearch" id="dateSearchLabel">搜索归档</label>
          <input id="dateSearch" type="search" placeholder="搜索日期、公司、关键词" />
        </div>

        <nav class="date-list" id="dateList"></nav>

        <div class="rail-section">
          <label id="archiveTagsLabel">归档标签</label>
          <div class="archive-tags" id="archiveTags"></div>
        </div>

        <div class="rail-section topic-section">
          <label id="topicLabel">主题聚合</label>
          <div class="topic-tags" id="topicTags"></div>
        </div>

        <details class="source-method" id="sourceMethod">
          <summary id="sourceMethodSummary">信息来源</summary>
          <div class="source-method-panel">
            <p id="sourceMethodText"></p>
            <div class="source-method-links" id="sourceMethodLinks"></div>
          </div>
        </details>

        <details class="source-method source-approach-method" id="sourceApproachMethod">
          <summary id="sourceApproachSummary">搜集方法论</summary>
          <div class="source-method-panel source-approach-panel" id="sourceApproachPanel"></div>
        </details>
      </aside>

      <main class="daily-view">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="issueMeta">Daily briefing</p>
          </div>
          <div class="topbar-actions">
            <div class="topbar-language">
              <div class="language-switch" id="languageSwitch" aria-label="语言切换"></div>
            </div>
            <p class="refresh-note" id="refreshNote">每天 7:30 生成，优先覆盖前一自然日的中美 AI 信号；少数产品、报告和深度阅读会标注近7天补位</p>
            <button class="icon-button" id="copyLinkButton" type="button" title="复制本地页面路径">
              <span aria-hidden="true">⌘</span>
            </button>
          </div>
        </header>

        <section class="hero-band" aria-label="今日摘要">
          <img id="heroImage" src="./assets/ai-daily-hero.png" alt="AI Daily Atlas visual" />
          <div class="hero-copy">
            <p class="eyebrow">Today in AI</p>
            <h3 id="heroHeadline">从模型能力到真实落地</h3>
            <p id="heroSummary"></p>
          </div>
        </section>

        <section class="controls" aria-label="筛选工具">
          <div class="search-wrap">
            <label for="contentSearch" id="contentSearchLabel">搜索当前日报</label>
            <input id="contentSearch" type="search" placeholder="例如 DeepSeek、机器人、RAG、香港岗位" />
          </div>
          <div class="tabs" id="sectionTabs" role="tablist" aria-label="内容分类"></div>
        </section>

        <section class="content-grid" id="contentGrid" aria-live="polite"></section>
      </main>
    </div>

    <template id="storyTemplate">
      <article class="story-card">
        <div class="story-topline">
          <div class="section-identity">
            <span class="section-code"></span>
            <span class="section-label"></span>
          </div>
          <span class="priority"></span>
        </div>
        <h3></h3>
        <p class="dek"></p>
        <div class="details"></div>
        <p class="why"></p>
        <div class="link-row"></div>
      </article>
    </template>

    <script src="./app.js?v=20260518-26020449465"></script>
  </body>
</html>
